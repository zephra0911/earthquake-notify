name: Deploy to Google Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy earthquake_monitor
        run: |
          gcloud functions deploy earthquake-monitor \
            --gen2 \
            --runtime=python312 \
            --region=asia-northeast1 \
            --source=. \
            --entry-point=earthquake_monitor \
            --trigger-topic=earthquake-monitor-topic

      - name: Deploy watchdog_notify
        run: |
          gcloud functions deploy watchdog-notify \
            --gen2 \
            --runtime=python312 \
            --region=asia-northeast1 \
            --source=. \
            --entry-point=watchdog_notify \
            --trigger-topic=watchdog-notify-topic